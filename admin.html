<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Administrador de Catálogo</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f5f7;
            color: #222;
        }

        .header {
            background: #111;
            color: white;
            padding: 20px;
        }

        .header h1 {
            margin: 0;
            font-size: 22px;
        }

        .container {
            max-width: 1100px;
            margin: 25px auto;
            padding: 0 15px;
        }

        .card {
            background: white;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 2px 10px rgba(0,0,0,.08);
        }

        .card h2 {
            margin-top: 0;
        }

        .status {
            padding: 12px;
            border-radius: 8px;
            background: #eef6ff;
            margin-bottom: 15px;
        }

        .danger {
            background: #fff0f0;
        }

        .success {
            background: #effbef;
        }

        button {
            border: 0;
            border-radius: 8px;
            padding: 11px 18px;
            cursor: pointer;
            font-weight: bold;
        }

        .primary {
            background: #111;
            color: white;
        }

        input {
            width: 100%;
            padding: 11px;
            border: 1px solid #ccc;
            border-radius: 7px;
            font-size: 15px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 6px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
        }

        @media(max-width:700px) {
            .grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

<header class="header">
    <h1>⚙️ Administrador de Catálogo</h1>
</header>

<main class="container">

    <section class="card">

        <h2>Estado del nuevo sistema</h2>

        <div id="estado" class="status">
            Cargando...
        </div>

    </section>


    <section class="card">

        <h2>Configuración</h2>

        <div class="grid">

            <div>
                <label>Versión</label>
                <input id="version" type="text">
            </div>

        </div>

        <br>

        <button class="primary" onclick="guardarConfiguracion()">
            Guardar
        </button>

    </section>

      <section class="card">

    <h2>📱 Equipos</h2>

    <div style="margin-bottom:15px;">

        <label for="buscarEquipo">
            Buscar equipo
        </label>

        <input
            id="buscarEquipo"
            type="text"
            placeholder="Escribe modelo, marca o ID..."
            autocomplete="off"
        >

    </div>

    <div id="listaEquipos">
        Cargando equipos...
    </div>

    <div
        id="editorEquipo"
        style="display:none; margin-top:20px;"
    >
    </div>

</section>

</main>

<script src="catalog.js"></script>
<script src="catalog-data.js"></script>
<script src="admin.js"></script>

</body>
</html>
